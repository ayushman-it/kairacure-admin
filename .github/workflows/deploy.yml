name: Deploy Admin

on:
  push:
    branches: [main]

concurrency:
  group: deploy-admin
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '987119352718' }}
  DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN || 'arn:aws:iam::987119352718:role/kairacure-github-deploy' }}
  S3_ADMIN: ${{ vars.S3_ADMIN_BUCKET || 'kairacure-admin-prod' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Verify build
        run: |
          if [ ! -f dist/index.html ]; then
            echo "FAIL: dist/index.html not found"
            exit 1
          fi
          echo "Build verified"

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ env.S3_ADMIN }}/ \
            --region ${{ env.AWS_REGION }} \
            --delete \
            --cache-control "public,max-age=300"
          aws s3 cp s3://${{ env.S3_ADMIN }}/index.html s3://${{ env.S3_ADMIN }}/index.html \
            --region ${{ env.AWS_REGION }} \
            --cache-control "no-cache"
          echo "Deployed to s3://${{ env.S3_ADMIN }}/"

      - name: Verify deployment
        run: |
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://${{ env.S3_ADMIN }}.s3-website.${{ env.AWS_REGION }}.amazonaws.com/)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Verification PASSED (HTTP $HTTP_CODE)"
          else
            echo "WARNING: Homepage returned HTTP $HTTP_CODE"
          fi

      - name: Invalidate CloudFront cache
        continue-on-error: true
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          DIST_ID="$CLOUDFRONT_DISTRIBUTION_ID"
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/index.html" "/*" \
              --region us-east-1
            echo "CloudFront invalidation sent for $DIST_ID"
          else
            echo "No CloudFront distribution ID configured (skipped)"
          fi